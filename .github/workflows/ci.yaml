name: CI

on:
  push:
    branches:
      - master
  pull_request: ~

env:
  PIPCACHEVERSION: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pylint-${{ hashFiles('pyproject.toml') }}-${{ env.PIPCACHEVERSION }}
      - run: python -m pip install . pylint
      - run: pylint --errors-only --jobs=0 pyEPR

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}-${{ env.PIPCACHEVERSION }}
          restore-keys: |
            test-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}-
      - run: python -m pip install ".[test]"
      - run: pytest tests/ -m "not hfss" -q

  test_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: docs-${{ hashFiles('pyproject.toml') }}-${{ env.PIPCACHEVERSION }}
      - run: python -m pip install ".[docs]"
      - name: Copy tutorial notebooks into docs source
        run: |
          rm -rf docs/source/_tutorial_notebooks
          cp -r _tutorial_notebooks docs/source/_tutorial_notebooks
      - name: Build docs
        run: cd docs && make html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs
          path: docs/build/html/
          retention-days: 5
