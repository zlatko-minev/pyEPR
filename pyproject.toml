[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[project]
name = "pyEPR-quantum"
version = "0.9.0"
description = "Python (py) Energy-Participation-Ratio (EPR) package"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Zlatko K. Minev", email = "zlatko.minev@aya.yale.edu" },
]
maintainers = [
    { name = "Zlatko Minev, pyEPR team" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]


classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "addict",
    "numpy>=1.15.0",
    "pandas>=1.0.1",
    "matplotlib>=3.1.0",
    "scipy>=1.3.0",
    "xarray>=0.10.0",
    "sympy>=1.3",
    "pint>=0.8",
    "qutip>=3.5.0",
    "seaborn>=0.10.0",
]

[dependency-groups]
docs = [
    "sphinx",
    "sphinx-rtd-theme>=0.4.0",
    "numpydoc",
]
dev = [
    "pylint",
    "pytest",
    "ipython>=7.0.0",
]
test = [
    "pytest",
]


[project.urls]
Homepage = "https://github.com/zlatko-minev/pyEPR"
Documentation = "https://pyepr-docs.readthedocs.io/en/latest/"

[tool.uv.build-backend]
module-name = "pyEPR"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
